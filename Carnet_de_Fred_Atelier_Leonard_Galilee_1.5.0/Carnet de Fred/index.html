<div id="app">
  <nav id="nav" aria-label="Navigation principale">
    <div class="brand" aria-hidden="true"><svg class="ic"><use href="#i-sticks"/></svg></div>
    <a href="#/notes" class="nav-item" data-act="nav" data-to="#/notes" data-nav="notes">
      <svg class="ic"><use href="#i-notes"/></svg><span>Notes</span></a>
    <a href="#/calendar" class="nav-item" data-act="nav" data-to="#/calendar" data-nav="calendar">
      <svg class="ic"><use href="#i-cal"/></svg><span>Agenda</span></a>
    <button id="fab" class="fab" data-act="fab" aria-label="Dicter une nouvelle note" title="Dicter une nouvelle note (Alt+D)">
      <svg class="ic mic-ic"><use href="#i-mic"/></svg><svg class="ic stop-ic"><use href="#i-stop"/></svg></button>
    <a href="#/tasks" class="nav-item" data-act="nav" data-to="#/tasks" data-nav="tasks">
      <svg class="ic"><use href="#i-tasks"/></svg><span>Tâches</span><b class="badge" id="task-badge" hidden></b></a>
    <a href="#/search" class="nav-item nav-desk" data-act="nav" data-to="#/search" data-nav="search">
      <svg class="ic"><use href="#i-search"/></svg><span>Chercher</span></a>
    <a href="#/folders" class="nav-item" data-act="nav" data-to="#/folders" data-nav="folders">
      <svg class="ic"><use href="#i-folder"/></svg><span>Dossiers</span></a>
  </nav>
  <main id="list" tabindex="-1"></main>
  <section id="detail" aria-label="Note"></section>
</div>

  <div class="scrim" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="update-bar" hidden>
  <span>Nouvelle version disponible</span>
  <button data-act="update-app">Actualiser</button>
</div>

<script src="config.js"></script>
<script src="app.js" defer></script>
